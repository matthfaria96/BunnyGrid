<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A3C"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.32" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#fill)"/>
  <circle cx="32" cy="32" r="31" fill="url(#shine)"/>
  <circle cx="32" cy="32" r="30.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- Interlaced knot: three rounded loops at 60° steps. -->
  <g transform="translate(32 32)" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round">
    <rect x="-7.5" y="-17" width="15" height="25" rx="7.5"/>
    <rect x="-7.5" y="-17" width="15" height="25" rx="7.5" transform="rotate(120)"/>
    <rect x="-7.5" y="-17" width="15" height="25" rx="7.5" transform="rotate(240)"/>
  </g>
</svg>
